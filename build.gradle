plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"war_mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

/* These generated textures and particle definitions are client-only.  They
 * are mirrored under src/client/resources for particle-atlas discovery; keep
 * their historical main-resource copies out of the combined production JAR
 * so splitEnvironmentSourceSets does not package every asset twice. */
sourceSets.main.resources {
	exclude "assets/war_mod/particles/warhead_fireball.json"
	exclude "assets/war_mod/particles/warhead_smoke.json"
	exclude "assets/war_mod/textures/effect/**"
	exclude "assets/war_mod/textures/particle/**"
}

repositories {
	maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Distant Horizons API 7.0.0. Modrinth's Maven endpoint uses the published
	// project/version IDs here; the API is compile-only because DH supplies it at runtime.
	compileOnly "maven.modrinth:Xs0XTOVv:GgrzKRsK"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

test {
	useJUnitPlatform()
}
