plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"war_mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

/* Generated visual resources are deliberately mirrored between the common
 * and client source sets. Particle-atlas discovery needs the client copy,
 * while direct mesh render types need the common copy during split-source-set
 * development runs. The mirrored files are byte-identical, so collapse them
 * only when assembling the distributable JAR. */
tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
	maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Distant Horizons API 7.0.0. Modrinth's Maven endpoint uses the published
	// project/version IDs here; the API is compile-only because DH supplies it at runtime.
	compileOnly "maven.modrinth:Xs0XTOVv:GgrzKRsK"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

test {
	useJUnitPlatform()
}
