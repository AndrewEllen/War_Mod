name: Artillery compile check

on:
  push:
    branches:
      - feature/artillery-and-yield-variants

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Java sources
        run: ./gradlew compileJava compileClientJava --stacktrace
